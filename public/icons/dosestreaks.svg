<!--
  Build input for scripts/generate-favicon.mjs — NOT served.

  Same mark and same 1.6x zoom as public/icon.svg; only the corner radius
  differs (rx 40 here, rx 115 there).

  ⚠️ Do NOT back the mark off to a smaller scale to "leave the plate visible
  as a frame". That was tried (scale 1.3) and it is what made the tab icon
  read GREY: at 16 CSS pixels a mark that small antialiases into pale
  blue-grey across a mostly-white tile, so the tab shows a washed-out blob
  rather than a blue pulse and a green sprout. Legibility at tab size comes
  from the mark filling the tile, not from framing it.

  The radius is small on purpose. A rounded corner is transparent, and a
  browser tab strip is dark in dark mode, so a large radius (the rx 115 the
  app icon uses) sat the mark in a visibly black-cornered box. rx 40 keeps
  the corner visibly trimmed while the dark notches stay small. An OS app
  icon is masked by the platform and wants the full radius; a favicon is
  composited straight onto chrome and cannot afford it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DoseStreaks">
  <rect width="512" height="512" rx="40" fill="#ffffff"/>
  <g transform="translate(2,-2) translate(254,258) scale(1.6) translate(-254,-258)">
    <path d="M120 300 L168 300 L188 268 L206 332 L232 184 L258 332 L278 300 L312 300"
          fill="none" stroke="#005ea3" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M312 300 C 340 284 350 246 340 206"
          fill="none" stroke="#1a7f37" stroke-width="24" stroke-linecap="round"/>
    <path d="M334 252 C 372 236 388 248 382 280 C 352 280 340 270 334 252 Z" fill="#1a7f37"/>
    <path d="M340 226 C 304 210 282 222 290 252 C 322 252 334 240 340 226 Z" fill="#1a7f37"/>
  </g>
</svg>
